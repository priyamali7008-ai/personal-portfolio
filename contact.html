<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    
        <div class="container">

            <div class="row">

                <!-- Contact Information -->
                <div class="contact-left">

                    <h1 class="sub-title">Contact Me</h1>

                    <p>
                        <i class="fa-solid fa-paper-plane"></i>
                        your-email@example.com
                    </p>

                    <p>
                        <i class="fa-solid fa-phone"></i>
                        +91 1234567890
                    </p>


                    <!-- Social Media -->
                    <div class="social-icons">

                        <a href="https://www.linkedin.com/in/priya-kumar-mali-79173636b?utm_source=share_via&utm_content=profile&utm_medium=member_android"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="LinkedIn">

                            <i class="fa-brands fa-linkedin-in"></i>

                        </a>


                        <a href="https://github.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="GitHub">

                            <i class="fa-brands fa-github"></i>

                        </a>


                        <a href="https://www.instagram.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Instagram">

                            <i class="fa-brands fa-instagram"></i>

                        </a>

                    </div>


                    <!-- Resume -->
                    <a href="images/cv.pdf"
                        download
                        class="btn btn2">

                        Download Resume

                    </a>

                </div>


                <!-- Contact Form -->
                <div class="contact-right">

                    <form action="#" method="post">

                        <label for="name" class="sr-only">
                            Your Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Your Name"
                            required
                        >


                        <label for="email" class="sr-only">
                            Your Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Your Email"
                            required
                        >


                        <label for="message" class="sr-only">
                            Your Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            placeholder="Your Message"
                            required
                        ></textarea>


                        <button
                            type="submit"
                            class="btn btn2">

                            Send Message

                        </button>

                    </form>

                </div>

            </div>

        </div>


        <!-- Copyright -->
        <div class="copyright">

            <p>
                Copyright © 2026 Priya Mali. All Rights Reserved.
            </p>

        </div>
</body>
</html>
